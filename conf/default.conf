server {
  listen 80;

  location ${URL_PREFIX} {
    root /usr/share/nginx/html;
    index index.html index.htm;
    # The SPA shell is the *last* try_files argument on purpose: nginx then
    # reaches it through an internal redirect, which re-runs location matching
    # and lands in the exact-match block below (so deep routes and the bare
    # prefix get its headers). Listed before `=404` it would be served in this
    # context instead. A missing index.html still yields a 404 from that block.
    try_files $uri ${URL_PREFIX}index.html;

    # Runtime API config (written by entrypoint.sh) and the SPA shell must not
    # be cached, so a changed API_BASE is picked up on the next reload. Nested
    # exact-match locations inherit `root` but not `try_files`, so each resolves
    # its own file.
    location = ${URL_PREFIX}config.js {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location = ${URL_PREFIX}index.html {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Add proper MIME types for JavaScript modules
    location ~* \.js$ {
      add_header Content-Type application/javascript;
    }

    location ~* \.mjs$ {
      add_header Content-Type application/javascript;
    }
  }

  location = / {
    absolute_redirect off;
    return 301 ${URL_PREFIX};
  }

  location = ${URL_PREFIX_NO_TRAIL} {
    absolute_redirect off;
    return 301 ${URL_PREFIX};
  }

  # Logout: expire the authservice session cookie, which only a server response
  # can do (it is HttpOnly). The redirect below is then unauthenticated, so
  # authservice challenges it and the browser lands on the Dex login page.
  location = ${URL_PREFIX_NO_TRAIL}/logout {
    absolute_redirect off;
    add_header Set-Cookie "authservice_session=; Path=/; Max-Age=0; HttpOnly; Secure" always;
    add_header Set-Cookie "oidc_state_csrf=; Path=/; Max-Age=0; HttpOnly; Secure" always;
    add_header Cache-Control "no-store" always;
    return 302 ${URL_PREFIX};
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
